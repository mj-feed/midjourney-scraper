<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midjourney Explore Browser</title>
<style>
:root {
  --bg: #0a0a0b;
  --bg-elev: #131316;
  --bg-elev2: #1c1c20;
  --border: #2a2a30;
  --border-light: #3a3a42;
  --text: #e8e8ec;
  --text-dim: #8b8b94;
  --text-faint: #5a5a62;
  --accent: #e91e63;
  --accent-dim: #ad1457;
  --accent-glow: rgba(233, 30, 99, 0.15);
  --success: #4caf50;
  --warning: #ff9800;
  --type-image: #607d8b;
  --type-video: #9c27b0;
  --type-style: #ff9800;
  --sidebar-w: 280px;
  --topbar-h: 56px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

/* ===== Layout ===== */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: var(--topbar-h) 1fr; height: 100vh; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg-elev); border-bottom: 1px solid var(--border); z-index: 20; }
.sidebar { background: var(--bg-elev); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
.main { overflow-y: auto; padding: 16px; position: relative; }

/* ===== Topbar ===== */
.topbar-search { flex: 1; max-width: 600px; position: relative; }
.topbar-search input {
  width: 100%; height: 36px; padding: 0 12px 0 36px;
  background: var(--bg-elev2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 14px; outline: none;
}
.topbar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
.topbar-search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
.topbar-search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 11px; color: var(--text-dim); }
.topbar-stats { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
.topbar-btn { padding: 6px 10px; border-radius: 6px; color: var(--text-dim); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.topbar-btn:hover { background: var(--bg-elev2); color: var(--text); }
.topbar-btn.active { background: var(--accent-glow); color: var(--accent); }
.topbar-divider { width: 1px; height: 24px; background: var(--border); }

/* ===== Sidebar ===== */
.facet-group { margin-bottom: 16px; }
.facet-group-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); margin-bottom: 6px; padding: 0 4px; display: flex; justify-content: space-between; align-items: center; }
.facet-group-title .count { color: var(--text-dim); font-weight: 400; }
.facet-list { display: flex; flex-direction: column; gap: 1px; }
.facet-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; font-size: 13px; cursor: pointer; color: var(--text-dim); }
.facet-item:hover { background: var(--bg-elev2); color: var(--text); }
.facet-item.active { background: var(--accent-glow); color: var(--accent); }
.facet-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facet-item .badge { font-size: 11px; color: var(--text-faint); background: var(--bg-elev2); padding: 1px 6px; border-radius: 8px; min-width: 24px; text-align: center; }
.facet-item.active .badge { background: var(--accent-dim); color: var(--text); }
.type-badge { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.type-badge.image { background: var(--type-image); }
.type-badge.video { background: var(--type-video); }
.type-badge.style { background: var(--type-style); }

/* ===== Grid ===== */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.grid.dense { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.grid.sparse { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; cursor: pointer; position: relative; transition: border-color 0.15s, transform 0.1s;
}
.card:hover { border-color: var(--border-light); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
.card-media { position: relative; aspect-ratio: 1; background: var(--bg-elev2); overflow: hidden; }
.card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-media .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-faint); font-size: 12px; text-align: center; padding: 12px; }
.card-media .type-tag { position: absolute; top: 6px; left: 6px; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; color: white; }
.card-media .type-tag.image { background: var(--type-image); }
.card-media .type-tag.video { background: var(--type-video); }
.card-media .type-tag.style { background: var(--type-style); }
.card-media .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 40px; height: 40px; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.card-info { padding: 8px 10px; }
.card-prompt { font-size: 12px; color: var(--text-dim); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
.card-prompt.empty { font-style: italic; color: var(--text-faint); }
.card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 11px; color: var(--text-faint); }
.card-user { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.card-feed { text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
.card-style-code { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; color: var(--type-style); font-weight: 600; }

/* ===== Empty / Loading ===== */
.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
.loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-dim); }

/* ===== Drawer (detail panel) ===== */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw);
  background: var(--bg-elev); border-left: 1px solid var(--border); z-index: 40;
  transform: translateX(100%); transition: transform 0.25s ease; overflow-y: auto;
  display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-elev); z-index: 1; }
.drawer-header h3 { font-size: 14px; font-weight: 600; }
.drawer-close { padding: 6px 10px; border-radius: 6px; color: var(--text-dim); }
.drawer-close:hover { background: var(--bg-elev2); color: var(--text); }
.drawer-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.drawer-media { background: var(--bg); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 300px; }
.drawer-media img, .drawer-media video { max-width: 100%; max-height: 70vh; object-fit: contain; }
.drawer-section h4 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); margin-bottom: 8px; }
.drawer-prompt { font-size: 14px; line-height: 1.6; color: var(--text); background: var(--bg); padding: 12px; border-radius: 6px; border-left: 3px solid var(--accent); }
.drawer-prompt.empty { color: var(--text-faint); font-style: italic; border-color: var(--border); }
.drawer-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.drawer-field { background: var(--bg); padding: 10px 12px; border-radius: 6px; }
.drawer-field-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); margin-bottom: 4px; }
.drawer-field-value { font-size: 13px; color: var(--text); word-break: break-word; }
.drawer-field-value a { color: var(--accent); text-decoration: none; }
.drawer-field-value a:hover { text-decoration: underline; }
.drawer-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 3px 8px; border-radius: 4px; font-size: 11px; background: var(--bg-elev2); color: var(--text-dim); border: 1px solid var(--border); }
.tag.personalize { border-color: var(--type-image); color: var(--type-image); }
.tag.styleRef { border-color: var(--type-style); color: var(--type-style); }
.tag.depthRef { border-color: var(--type-video); color: var(--type-video); }
.drawer-urls { display: flex; flex-direction: column; gap: 4px; }
.drawer-url { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg); border-radius: 4px; font-size: 11px; font-family: 'SF Mono', Consolas, monospace; color: var(--text-dim); }
.drawer-url a { color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.drawer-url a:hover { text-decoration: underline; }
.drawer-nav { display: flex; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--bg-elev); }
.drawer-nav-btn { padding: 6px 12px; border-radius: 6px; background: var(--bg-elev2); color: var(--text-dim); font-size: 13px; }
.drawer-nav-btn:hover { background: var(--border); color: var(--text); }
.drawer-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ===== Command Palette ===== */
.cmdk-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none; align-items: flex-start; justify-content: center; padding-top: 120px; }
.cmdk-backdrop.open { display: flex; }
.cmdk { width: min(560px, 90vw); background: var(--bg-elev); border: 1px solid var(--border-light); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden; }
.cmdk-input { width: 100%; padding: 16px 20px; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-size: 15px; outline: none; }
.cmdk-results { max-height: 400px; overflow-y: auto; padding: 8px; }
.cmdk-group { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); padding: 8px 12px 4px; }
.cmdk-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; cursor: pointer; color: var(--text-dim); }
.cmdk-item:hover, .cmdk-item.selected { background: var(--bg-elev2); color: var(--text); }
.cmdk-item.selected { background: var(--accent-glow); color: var(--accent); }
.cmdk-item .icon { width: 16px; text-align: center; }
.cmdk-item .label { flex: 1; }
.cmdk-item .hint { font-size: 11px; color: var(--text-faint); }

/* ===== Shortcuts Help ===== */
.shortcuts-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none; align-items: center; justify-content: center; }
.shortcuts-backdrop.open { display: flex; }
.shortcuts { width: min(560px, 90vw); max-height: 80vh; background: var(--bg-elev); border: 1px solid var(--border-light); border-radius: 10px; overflow-y: auto; padding: 24px; }
.shortcuts h2 { font-size: 18px; margin-bottom: 16px; }
.shortcuts-section { margin-bottom: 20px; }
.shortcuts-section h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); margin-bottom: 8px; }
.shortcut-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
.shortcut-row:last-child { border-bottom: none; }
.shortcut-row .desc { color: var(--text-dim); font-size: 13px; }
.shortcut-row kbd { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 12px; font-family: 'SF Mono', Consolas, monospace; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
</style>
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-search">
      <span class="icon">🔍</span>
      <input id="search" type="text" placeholder="Search prompts, users, tags…" />
      <kbd>/</kbd>
    </div>
    <div class="topbar-stats" id="stats">Loading…</div>
    <div class="topbar-divider"></div>
    <button class="topbar-btn" id="btn-cmdk" title="Command palette (Cmd+K)">⌘K <span style="font-size:11px;color:var(--text-faint)">Commands</span></button>
    <button class="topbar-btn" id="btn-shortcuts" title="Keyboard shortcuts (?)">?</button>
    <div class="topbar-divider"></div>
    <button class="topbar-btn" id="btn-density" title="Cycle density">⊞ Grid</button>
    <button class="topbar-btn" id="btn-sort" title="Cycle sort">↕ Sort</button>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <!-- Facets populated by JS -->
  </aside>

  <!-- Main grid -->
  <main class="main" id="main">
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- Drawer -->
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <h3 id="drawer-title">Item Detail</h3>
    <button class="drawer-close" id="drawer-close">✕ Esc</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-nav">
    <button class="drawer-nav-btn" id="drawer-prev">← Prev (h)</button>
    <button class="drawer-nav-btn" id="drawer-next">Next (l) →</button>
  </div>
</aside>

<!-- Command Palette -->
<div class="cmdk-backdrop" id="cmdk-backdrop">
  <div class="cmdk">
    <input class="cmdk-input" id="cmdk-input" type="text" placeholder="Type a command or search…" />
    <div class="cmdk-results" id="cmdk-results"></div>
  </div>
</div>

<!-- Shortcuts Help -->
<div class="shortcuts-backdrop" id="shortcuts-backdrop">
  <div class="shortcuts" id="shortcuts-content"></div>
</div>

<script>
// ===== State =====
const STATE = {
  items: [],
  filtered: [],
  facets: {},
  stats: {},
  filters: {
    search: '',
    type: new Set(),      // image, video, style
    feed: new Set(),      // top, top_week, etc.
    aspect: new Set(),    // 9:16, 2:3, etc.
    user: new Set(),
    tag: new Set(),
  },
  selectedIdx: -1,        // index into STATE.filtered
  drawerOpen: false,
  density: 'normal',      // dense, normal, sparse
  sort: 'default',        // default, prompt-asc, prompt-desc, user, date-desc
  cmdkOpen: false,
  cmdkSelectedIdx: 0,
  cmdkResults: [],
};

const FEED_LABELS = {
  top: 'Top Day', top_week: 'Top Week', top_month: 'Top Month', top_all: 'Top All',
  video_top: 'Videos', styles_top: 'Styles', styles_top_week: 'Styles Week', styles_top_month: 'Styles Month',
};

// ===== Data Loading =====
async function loadData() {
  try {
    const [catRes, facetsRes, statsRes] = await Promise.all([
      fetch('catalog/catalog.json'),
      fetch('catalog/facets.json'),
      fetch('catalog/stats.json'),
    ]);
    STATE.items = await catRes.json();
    STATE.facets = await facetsRes.json();
    STATE.stats = await statsRes.json();
    document.getElementById('stats').textContent = `${STATE.items.length} items · ${STATE.stats.unique_users || 0} users`;
    renderFacets();
    applyFilters();
  } catch (e) {
    console.error('Failed to load data', e);
    document.getElementById('grid').innerHTML = `<div class="empty-state"><div class="icon">⚠</div><div>Failed to load data</div><div style="margin-top:8px;font-size:12px">${e.message}</div></div>`;
  }
}

// ===== Filtering =====
function applyFilters() {
  const f = STATE.filters;
  const q = f.search.toLowerCase().trim();
  STATE.filtered = STATE.items.filter(it => {
    // Search
    if (q) {
      const pt = (it.prompt_text || '').toLowerCase();
      const u = ((it.user || {}).display_name || '').toLowerCase();
      const sref = (it.sref || '').toLowerCase();
      const tags = (it.tags || []).map(t => t.content || '').join(' ').toLowerCase();
      const haystack = `${pt} ${u} ${sref} ${tags}`;
      if (!haystack.includes(q)) return false;
    }
    // Type filter
    if (f.type.size && !f.type.has(it.type)) return false;
    // Feed filter
    if (f.feed.size && !f.feed.has(it.feed)) return false;
    // Aspect filter
    if (f.aspect.size) {
      const ar = it.aspect_ratio || 'unknown';
      if (!f.aspect.has(ar)) return false;
    }
    // User filter
    if (f.user.size) {
      const u = (it.user || {}).display_name || 'unknown';
      if (!f.user.has(u)) return false;
    }
    // Tag filter (AND across types, OR within — but for simplicity, ANY tag match)
    if (f.tag.size) {
      const itemTags = new Set((it.tags || []).map(t => `${t.type}:${t.content}`));
      let found = false;
      for (const t of f.tag) { if (itemTags.has(t)) { found = true; break; } }
      if (!found) return false;
    }
    return true;
  });
  // Sort
  applySort();
  STATE.selectedIdx = -1;
  renderGrid();
}

function applySort() {
  const s = STATE.sort;
  if (s === 'prompt-asc') {
    STATE.filtered.sort((a,b) => (a.prompt_text||'').localeCompare(b.prompt_text||''));
  } else if (s === 'prompt-desc') {
    STATE.filtered.sort((a,b) => (b.prompt_text||'').localeCompare(a.prompt_text||''));
  } else if (s === 'user') {
    STATE.filtered.sort((a,b) => ((a.user||{}).display_name||'').localeCompare((b.user||{}).display_name||''));
  } else if (s === 'date-desc') {
    STATE.filtered.sort((a,b) => (b.scraped_at||'').localeCompare(a.scraped_at||''));
  }
  // 'default' = original order (no sort)
}

// ===== Rendering: Facets =====
function renderFacets() {
  const sidebar = document.getElementById('sidebar');
  const f = STATE.facets;
  const html = [];

  // Type
  html.push(renderFacetGroup('Type', 'type', f.type || [], 'type-badge'));
  // Feed
  html.push(renderFacetGroup('Feed', 'feed', (f.feed || []).map(x => ({value: x.value, label: FEED_LABELS[x.value] || x.value, count: x.count}))));
  // Aspect Ratio
  html.push(renderFacetGroup('Aspect Ratio', 'aspect', f.aspect_ratio || []));
  // User (top 20)
  html.push(renderFacetGroup('User', 'user', (f.user || []).slice(0, 20)));
  // Job Type
  html.push(renderFacetGroup('Job Type', 'job_type', f.job_type || []));
  // Tags (top 30)
  html.push(renderFacetGroup('Tags', 'tag', (f.tag || []).slice(0, 30)));
  // Motion (videos)
  if (f.motion && f.motion.length) {
    html.push(renderFacetGroup('Motion', 'motion', f.motion));
  }

  sidebar.innerHTML = html.join('');
  // Attach click handlers
  sidebar.querySelectorAll('.facet-item').forEach(el => {
    el.addEventListener('click', () => toggleFilter(el.dataset.group, el.dataset.value));
  });
}

function renderFacetGroup(title, group, items, badgeClass) {
  if (!items || !items.length) return '';
  const total = items.reduce((s, x) => s + x.count, 0);
  const filters = STATE.filters[group] || new Set();
  const itemsHtml = items.map(item => {
    const active = filters.has(item.value) ? 'active' : '';
    const label = item.label || item.value;
    const badge = badgeClass ? `<span class="type-badge ${badgeClass === 'type-badge' ? item.value : ''}"></span>` : '';
    return `<div class="facet-item ${active}" data-group="${group}" data-value="${escapeAttr(item.value)}">
      ${badge}
      <span class="label">${escapeHtml(label)}</span>
      <span class="badge">${item.count}</span>
    </div>`;
  }).join('');
  return `<div class="facet-group">
    <div class="facet-group-title">${title} <span class="count">${total}</span></div>
    <div class="facet-list">${itemsHtml}</div>
  </div>`;
}

function toggleFilter(group, value) {
  const set = STATE.filters[group] || (STATE.filters[group] = new Set());
  if (set.has(value)) set.delete(value); else set.add(value);
  renderFacets();
  applyFilters();
}

// ===== Rendering: Grid =====
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.className = `grid ${STATE.density}`;
  if (!STATE.filtered.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><div>No items match your filters</div></div>`;
    return;
  }
  // Virtual-ish: render first 100, then lazy-load on scroll
  const RENDER_BATCH = 100;
  const visible = STATE.filtered.slice(0, RENDER_BATCH);
  grid.innerHTML = visible.map((it, i) => renderCard(it, i)).join('');
  // Attach click handlers
  grid.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openDrawer(parseInt(el.dataset.idx)));
  });
  // Lazy load more on scroll
  if (STATE.filtered.length > RENDER_BATCH) {
    setupLazyLoad(grid, RENDER_BATCH);
  }
}

function setupLazyLoad(grid, startIdx) {
  const main = document.getElementById('main');
  let loaded = startIdx;
  let loading = false;
  main.onscroll = () => {
    if (loading) return;
    if (main.scrollTop + main.clientHeight < main.scrollHeight - 200) return;
    loading = true;
    const batch = STATE.filtered.slice(loaded, loaded + 100);
    if (!batch.length) { main.onscroll = null; return; }
    const html = batch.map((it, i) => renderCard(it, loaded + i)).join('');
    grid.insertAdjacentHTML('beforeend', html);
    grid.querySelectorAll('.card').forEach(el => {
      if (!el.dataset.bound) {
        el.dataset.bound = '1';
        el.addEventListener('click', () => openDrawer(parseInt(el.dataset.idx)));
      }
    });
    loaded += batch.length;
    loading = false;
  };
}

function renderCard(it, idx) {
  const selected = idx === STATE.selectedIdx ? 'selected' : '';
  const type = it.type || 'image';
  const typeLabel = type.toUpperCase();
  const imgUrl = it.thumbnail_data_uri || (it.image_urls && it.image_urls[0]) || it.video_thumbnail_url || '';
  const prompt = it.prompt_text || '';
  const user = (it.user || {}).display_name || 'unknown';
  const feedLabel = FEED_LABELS[it.feed] || it.feed;
  let mediaHtml;
  if (imgUrl) {
    // If thumbnail_data_uri is present (base64), it's already cached — no onerror needed.
    // If it's a CDN URL, add retry logic with exponential backoff.
    const isDataUri = imgUrl.startsWith('data:');
    const onerror = isDataUri ? '' : ' onerror="this.dataset.tries=(this.dataset.tries||0)+1; if(this.dataset.tries<3){setTimeout(()=>{this.src=this.src.split(\'?\')[0]+\'?retry=\'+Date.now();},1000*this.dataset.tries);}else{this.parentElement.innerHTML=\'<div class=placeholder>Image not available</div>\';}"';
    mediaHtml = `<img loading="lazy" src="${imgUrl}" alt=""${onerror} />`;
  } else if (type === 'style') {
    mediaHtml = `<div class="placeholder">Style<br/><span class="card-style-code">--sref ${it.sref || '?'}</span></div>`;
  } else {
    mediaHtml = `<div class="placeholder">No preview</div>`;
  }
  const playIcon = type === 'video' ? `<div class="play-icon">▶</div>` : '';
  const promptHtml = prompt
    ? `<div class="card-prompt">${escapeHtml(prompt)}</div>`
    : (type === 'style' ? `<div class="card-prompt empty">--sref ${it.sref || ''}</div>` : `<div class="card-prompt empty">No prompt</div>`);
  return `<div class="card ${selected}" data-idx="${idx}" tabindex="0">
    <div class="card-media">
      ${mediaHtml}
      <span class="type-tag ${type}">${typeLabel}</span>
      ${playIcon}
    </div>
    <div class="card-info">
      ${promptHtml}
      <div class="card-meta">
        <span class="card-user">@${escapeHtml(user)}</span>
        <span class="card-feed">${feedLabel}</span>
      </div>
    </div>
  </div>`;
}

// ===== Drawer =====
function openDrawer(idx) {
  if (idx < 0 || idx >= STATE.filtered.length) return;
  STATE.selectedIdx = idx;
  STATE.drawerOpen = true;
  renderDrawer();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-backdrop').classList.add('open');
  // Update card selection
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  const card = document.querySelector(`.card[data-idx="${idx}"]`);
  if (card) {
    card.classList.add('selected');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function closeDrawer() {
  STATE.drawerOpen = false;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-backdrop').classList.remove('open');
}

function renderDrawer() {
  const it = STATE.filtered[STATE.selectedIdx];
  if (!it) return;
  const body = document.getElementById('drawer-body');
  const type = it.type || 'image';
  const feedLabel = FEED_LABELS[it.feed] || it.feed;

  // Media
  let mediaHtml = '';
  if (type === 'video' && it.video_urls && it.video_urls[0]) {
    mediaHtml = `<video src="${it.video_urls[0]}" controls autoplay loop></video>`;
  } else if (it.image_urls && it.image_urls[0]) {
    // Use larger size for drawer
    const bigUrl = (it.image_urls_all_sizes && it.image_urls_all_sizes.find(u => u.includes('_1024_'))) || it.image_urls[0];
    mediaHtml = `<img src="${bigUrl}" alt="" onerror="this.style.display='none'" />`;
  } else if (type === 'style') {
    mediaHtml = `<div class="placeholder" style="height:300px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--text-faint)">
      <div style="font-size:14px">Style Reference</div>
      <div class="card-style-code" style="font-size:24px;margin-top:8px">--sref ${it.sref || '?'}</div>
      <div style="font-size:11px;margin-top:8px">Image URL not available via API</div>
    </div>`;
  } else {
    mediaHtml = `<div class="placeholder">No media</div>`;
  }

  // Prompt
  const promptHtml = it.prompt_text
    ? `<div class="drawer-prompt">${escapeHtml(it.prompt_text)}</div>`
    : `<div class="drawer-prompt empty">${type === 'style' ? 'Style reference — no text prompt. Use with --sref ' + (it.sref || '') : 'No prompt'}</div>`;

  // Tags
  const tagsHtml = (it.tags || []).map(t => `<span class="tag ${t.type}">${t.type}:${escapeHtml(t.content||'')} ${t.t ? '('+t.t+')' : ''}</span>`).join('');

  // Fields
  const fields = [];
  fields.push(field('ID', it.id));
  fields.push(field('Type', type));
  fields.push(field('Feed', feedLabel));
  if (it.aspect_ratio) fields.push(field('Aspect Ratio', it.aspect_ratio));
  if ((it.dimensions||{}).width) fields.push(field('Dimensions', `${it.dimensions.width} × ${it.dimensions.height}`));
  if ((it.user||{}).display_name) fields.push(field('User', `@${it.user.display_name}`));
  if (it.sref) fields.push(field('SREF Code', `<code>--sref ${it.sref}</code>`));
  if ((it.job_metadata||{}).job_type) fields.push(field('Job Type', it.job_metadata.job_type));
  if ((it.job_metadata||{}).event_type) fields.push(field('Event Type', it.job_metadata.event_type));
  if ((it.job_metadata||{}).enqueue_time_iso) fields.push(field('Created', it.job_metadata.enqueue_time_iso));
  if ((it.video_metadata||{}).duration_seconds) fields.push(field('Duration', `${it.video_metadata.duration_seconds}s`));
  if ((it.video_metadata||{}).motion) fields.push(field('Motion', it.video_metadata.motion));
  fields.push(field('Scraped', it.scraped_at));

  // URLs
  const urls = [];
  if (it.image_urls) it.image_urls.forEach(u => urls.push(['Thumb', u]));
  if (it.image_urls_all_sizes) it.image_urls_all_sizes.forEach(u => {
    if (u.includes('_1024_')) urls.push(['Medium', u]);
    if (u.includes('_2048_')) urls.push(['Large', u]);
  });
  if (it.image_urls_original) it.image_urls_original.forEach(u => {
    if (u.endsWith('.png')) urls.push(['Original PNG', u]);
    if (u.endsWith('.webp')) urls.push(['Original WebP', u]);
  });
  if (it.video_urls) it.video_urls.forEach(u => urls.push(['Video MP4', u]));
  const urlsHtml = urls.map(([label, url]) => `<div class="drawer-url"><span style="min-width:90px;color:var(--text-faint)">${label}</span><a href="${url}" target="_blank" rel="noopener">${url}</a></div>`).join('');

  body.innerHTML = `
    <div class="drawer-media">${mediaHtml}</div>
    <div class="drawer-section">
      <h4>Prompt</h4>
      ${promptHtml}
    </div>
    ${tagsHtml ? `<div class="drawer-section"><h4>Tags</h4><div class="drawer-tags">${tagsHtml}</div></div>` : ''}
    <div class="drawer-section">
      <h4>Details</h4>
      <div class="drawer-fields">${fields.map(f => `<div class="drawer-field"><div class="drawer-field-label">${f[0]}</div><div class="drawer-field-value">${f[1]}</div></div>`).join('')}</div>
    </div>
    ${urlsHtml ? `<div class="drawer-section"><h4>CDN URLs (${urls.length})</h4><div class="drawer-urls">${urlsHtml}</div></div>` : ''}
  `;

  // Nav buttons
  document.getElementById('drawer-prev').disabled = STATE.selectedIdx <= 0;
  document.getElementById('drawer-next').disabled = STATE.selectedIdx >= STATE.filtered.length - 1;
}

function field(label, value) {
  if (!value && value !== 0) return [label, '—'];
  return [label, String(value)];
}

// ===== Command Palette =====
function openCmdK() {
  STATE.cmdkOpen = true;
  document.getElementById('cmdk-backdrop').classList.add('open');
  const input = document.getElementById('cmdk-input');
  input.value = '';
  input.focus();
  buildCmdKResults('');
}

function closeCmdK() {
  STATE.cmdkOpen = false;
  document.getElementById('cmdk-backdrop').classList.remove('open');
}

function buildCmdKResults(query) {
  const q = query.toLowerCase().trim();
  const results = [];

  // Commands
  const commands = [
    { group: 'Actions', icon: '⊞', label: 'Cycle grid density', hint: 'D', action: () => cycleDensity() },
    { group: 'Actions', icon: '↕', label: 'Cycle sort order', hint: 'S', action: () => cycleSort() },
    { group: 'Actions', icon: '✕', label: 'Clear all filters', hint: 'Esc', action: () => clearFilters() },
    { group: 'Actions', icon: '?', label: 'Show keyboard shortcuts', hint: '?', action: () => { closeCmdK(); openShortcuts(); } },
  ];

  // Feed filters
  const feedCmds = Object.entries(FEED_LABELS).map(([value, label]) => ({
    group: 'Filter by Feed', icon: '▶', label: `Show only ${label}`, hint: '', action: () => {
      STATE.filters.feed = new Set([value]);
      renderFacets(); applyFilters(); closeCmdK();
    }
  }));

  // Type filters
  const typeCmds = [
    { group: 'Filter by Type', icon: '🖼', label: 'Show only Images', action: () => { STATE.filters.type = new Set(['image']); renderFacets(); applyFilters(); closeCmdK(); } },
    { group: 'Filter by Type', icon: '🎬', label: 'Show only Videos', action: () => { STATE.filters.type = new Set(['video']); renderFacets(); applyFilters(); closeCmdK(); } },
    { group: 'Filter by Type', icon: '🎨', label: 'Show only Styles', action: () => { STATE.filters.type = new Set(['style']); renderFacets(); applyFilters(); closeCmdK(); } },
  ];

  // Quick-jump to items (search by prompt)
  let itemCmds = [];
  if (q) {
    const matches = STATE.items.filter(it => {
      const pt = (it.prompt_text || '').toLowerCase();
      const u = ((it.user||{}).display_name || '').toLowerCase();
      const sref = (it.sref || '').toLowerCase();
      return pt.includes(q) || u.includes(q) || sref.includes(q);
    }).slice(0, 15);
    itemCmds = matches.map(it => ({
      group: 'Jump to Item',
      icon: it.type === 'video' ? '🎬' : it.type === 'style' ? '🎨' : '🖼',
      label: (it.prompt_text || `--sref ${it.sref}` || `@${(it.user||{}).display_name}`).slice(0, 80),
      hint: `@${(it.user||{}).display_name || ''}`,
      action: () => {
        const idx = STATE.filtered.indexOf(it);
        if (idx >= 0) { openDrawer(idx); closeCmdK(); }
        else {
          // Clear filters and find
          clearFilters();
          setTimeout(() => {
            const i = STATE.filtered.indexOf(it);
            if (i >= 0) openDrawer(i);
            closeCmdK();
          }, 50);
        }
      }
    }));
  }

  const all = [...commands, ...feedCmds, ...typeCmds, ...itemCmds];
  const filtered = q ? all.filter(c => c.label.toLowerCase().includes(q)) : all;
  STATE.cmdkResults = filtered;
  STATE.cmdkSelectedIdx = 0;
  renderCmdKResults();
}

function renderCmdKResults() {
  const container = document.getElementById('cmdk-results');
  if (!STATE.cmdkResults.length) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-faint)">No results</div>';
    return;
  }
  let html = '';
  let lastGroup = '';
  STATE.cmdkResults.forEach((c, i) => {
    if (c.group !== lastGroup) {
      html += `<div class="cmdk-group">${c.group}</div>`;
      lastGroup = c.group;
    }
    const selected = i === STATE.cmdkSelectedIdx ? 'selected' : '';
    html += `<div class="cmdk-item ${selected}" data-idx="${i}">
      <span class="icon">${c.icon}</span>
      <span class="label">${escapeHtml(c.label)}</span>
      ${c.hint ? `<span class="hint">${escapeHtml(c.hint)}</span>` : ''}
    </div>`;
  });
  container.innerHTML = html;
  container.querySelectorAll('.cmdk-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      STATE.cmdkResults[idx].action();
    });
  });
}

// ===== Shortcuts Help =====
function openShortcuts() {
  document.getElementById('shortcuts-backdrop').classList.add('open');
  document.getElementById('shortcuts-content').innerHTML = SHORTCUTES_HTML;
}
function closeShortcuts() {
  document.getElementById('shortcuts-backdrop').classList.remove('open');
}

const SHORTCUTES_HTML = `
  <h2>Keyboard Shortcuts</h2>
  <div class="shortcuts-section">
    <h3>Navigation</h3>
    <div class="shortcut-row"><span class="desc">Move selection down/up</span><kbd>J</kbd> / <kbd>K</kbd></div>
    <div class="shortcut-row"><span class="desc">Move selection with arrows</span><kbd>↓</kbd> / <kbd>↑</kbd></div>
    <div class="shortcut-row"><span class="desc">Open item detail</span><kbd>Enter</kbd></div>
    <div class="shortcut-row"><span class="desc">Close drawer / palette / help</span><kbd>Esc</kbd></div>
    <div class="shortcut-row"><span class="desc">Next/prev item in drawer</span><kbd>L</kbd> / <kbd>H</kbd></div>
    <div class="shortcut-row"><span class="desc">Focus search</span><kbd>/</kbd></div>
  </div>
  <div class="shortcuts-section">
    <h3>Commands</h3>
    <div class="shortcut-row"><span class="desc">Open command palette</span><kbd>⌘K</kbd> / <kbd>Ctrl+K</kbd></div>
    <div class="shortcut-row"><span class="desc">Show this help</span><kbd>?</kbd></div>
    <div class="shortcut-row"><span class="desc">Cycle grid density</span><kbd>D</kbd></div>
    <div class="shortcut-row"><span class="desc">Cycle sort order</span><kbd>S</kbd></div>
    <div class="shortcut-row"><span class="desc">Clear all filters</span><kbd>⌘\</kbd> / <kbd>Ctrl+\\</kbd></div>
  </div>
  <div class="shortcuts-section">
    <h3>Filter by Type (in palette)</h3>
    <div class="shortcut-row"><span class="desc">Images only</span><kbd>1</kbd></div>
    <div class="shortcut-row"><span class="desc">Videos only</span><kbd>2</kbd></div>
    <div class="shortcut-row"><span class="desc">Styles only</span><kbd>3</kbd></div>
  </div>
`;

// ===== Helpers =====
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function cycleDensity() {
  STATE.density = STATE.density === 'normal' ? 'dense' : STATE.density === 'dense' ? 'sparse' : 'normal';
  renderGrid();
}
function cycleSort() {
  STATE.sort = STATE.sort === 'default' ? 'date-desc' : STATE.sort === 'date-desc' ? 'prompt-asc' : STATE.sort === 'prompt-asc' ? 'prompt-desc' : STATE.sort === 'prompt-desc' ? 'user' : 'default';
  applyFilters();
}
function clearFilters() {
  STATE.filters.type.clear();
  STATE.filters.feed.clear();
  STATE.filters.aspect.clear();
  STATE.filters.user.clear();
  STATE.filters.tag.clear();
  STATE.filters.search = '';
  document.getElementById('search').value = '';
  renderFacets();
  applyFilters();
}

// ===== Keyboard =====
document.addEventListener('keydown', (e) => {
  // Ignore if typing in an input (unless Escape or Cmd/Ctrl combos)
  const inInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
  const cmd = e.metaKey || e.ctrlKey;

  if (e.key === 'Escape') {
    if (STATE.cmdkOpen) { closeCmdK(); return; }
    if (document.getElementById('shortcuts-backdrop').classList.contains('open')) { closeShortcuts(); return; }
    if (STATE.drawerOpen) { closeDrawer(); return; }
    if (inInput) {
      // If search has text, clear it first; otherwise blur
      const search = document.getElementById('search');
      if (e.target === search && search.value) {
        search.value = '';
        STATE.filters.search = '';
        applyFilters();
        return;
      }
      e.target.blur();
      return;
    }
    // Clear filters if no modal open
    if (STATE.filters.type.size || STATE.filters.feed.size || STATE.filters.aspect.size || STATE.filters.user.size || STATE.filters.tag.size || STATE.filters.search) {
      clearFilters();
    }
    return;
  }

  // Cmd+K — command palette (works even in inputs)
  if (cmd && e.key === 'k') {
    e.preventDefault();
    if (STATE.cmdkOpen) closeCmdK(); else openCmdK();
    return;
  }

  // Cmd+\ — clear filters
  if (cmd && e.key === '\\') {
    e.preventDefault();
    clearFilters();
    return;
  }

  // If command palette is open
  if (STATE.cmdkOpen) {
    if (e.key === 'ArrowDown') { e.preventDefault(); STATE.cmdkSelectedIdx = Math.min(STATE.cmdkSelectedIdx + 1, STATE.cmdkResults.length - 1); renderCmdKResults(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); STATE.cmdkSelectedIdx = Math.max(STATE.cmdkSelectedIdx - 1, 0); renderCmdKResults(); return; }
    if (e.key === 'Enter') { e.preventDefault(); if (STATE.cmdkResults[STATE.cmdkSelectedIdx]) STATE.cmdkResults[STATE.cmdkSelectedIdx].action(); return; }
    return; // Don't process other keys while palette is open
  }

  // If typing in input, don't process single-key shortcuts
  if (inInput) return;

  // / — focus search
  if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); return; }

  // ? — help
  if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }

  // If drawer is open
  if (STATE.drawerOpen) {
    if (e.key === 'h' || e.key === 'H') { e.preventDefault(); if (STATE.selectedIdx > 0) openDrawer(STATE.selectedIdx - 1); return; }
    if (e.key === 'l' || e.key === 'L') { e.preventDefault(); if (STATE.selectedIdx < STATE.filtered.length - 1) openDrawer(STATE.selectedIdx + 1); return; }
    if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowDown') { e.preventDefault(); if (STATE.selectedIdx < STATE.filtered.length - 1) openDrawer(STATE.selectedIdx + 1); return; }
    if (e.key === 'k' || e.key === 'K' || e.key === 'ArrowUp') { e.preventDefault(); if (STATE.selectedIdx > 0) openDrawer(STATE.selectedIdx - 1); return; }
    return;
  }

  // Grid navigation
  if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowDown') {
    e.preventDefault();
    if (STATE.selectedIdx < STATE.filtered.length - 1) {
      STATE.selectedIdx++;
      updateCardSelection();
    }
    return;
  }
  if (e.key === 'k' || e.key === 'K' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (STATE.selectedIdx > 0) {
      STATE.selectedIdx--;
      updateCardSelection();
    }
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (STATE.selectedIdx >= 0) openDrawer(STATE.selectedIdx);
    return;
  }

  // Single-key shortcuts
  if (e.key === 'd' || e.key === 'D') { e.preventDefault(); cycleDensity(); return; }
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); cycleSort(); return; }
  if (e.key === '1') { e.preventDefault(); STATE.filters.type = new Set(['image']); renderFacets(); applyFilters(); return; }
  if (e.key === '2') { e.preventDefault(); STATE.filters.type = new Set(['video']); renderFacets(); applyFilters(); return; }
  if (e.key === '3') { e.preventDefault(); STATE.filters.type = new Set(['style']); renderFacets(); applyFilters(); return; }
});

function updateCardSelection() {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  const card = document.querySelector(`.card[data-idx="${STATE.selectedIdx}"]`);
  if (card) {
    card.classList.add('selected');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else if (STATE.selectedIdx >= 0) {
    // Card not rendered yet (lazy load) — scroll to bottom to trigger load
    const main = document.getElementById('main');
    main.scrollTop = main.scrollHeight;
  }
}

// ===== Event Listeners =====
document.getElementById('search').addEventListener('input', (e) => {
  STATE.filters.search = e.target.value;
  clearTimeout(STATE._searchTimer);
  STATE._searchTimer = setTimeout(() => applyFilters(), 200);
});
document.getElementById('btn-cmdk').addEventListener('click', openCmdK);
document.getElementById('btn-shortcuts').addEventListener('click', openShortcuts);
document.getElementById('btn-density').addEventListener('click', cycleDensity);
document.getElementById('btn-sort').addEventListener('click', cycleSort);
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);
document.getElementById('drawer-prev').addEventListener('click', () => { if (STATE.selectedIdx > 0) openDrawer(STATE.selectedIdx - 1); });
document.getElementById('drawer-next').addEventListener('click', () => { if (STATE.selectedIdx < STATE.filtered.length - 1) openDrawer(STATE.selectedIdx + 1); });
document.getElementById('cmdk-backdrop').addEventListener('click', closeCmdK);
document.getElementById('shortcuts-backdrop').addEventListener('click', closeShortcuts);
document.getElementById('cmdk-input').addEventListener('input', (e) => buildCmdKResults(e.target.value));

// ===== Init =====
loadData();
</script>
